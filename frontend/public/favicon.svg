<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff7ed" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Tiffin Box Container Group -->
  <g transform="translate(106, 90)">
    <!-- Tiffin Handle Top -->
    <path d="M 100,50 C 100,10 200,10 200,50 L 200,70 L 100,70 Z" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

    <!-- Tiffin Layer 1 (Top Tier) -->
    <rect x="30" y="70" width="240" height="70" rx="16" fill="url(#metal)" />
    <rect x="20" y="130" width="260" height="20" rx="8" fill="#fdba74" />

    <!-- Tiffin Layer 2 (Middle Tier) -->
    <rect x="30" y="150" width="240" height="70" rx="16" fill="url(#metal)" />
    <rect x="20" y="210" width="260" height="20" rx="8" fill="#fdba74" />

    <!-- Tiffin Layer 3 (Bottom Tier) -->
    <rect x="30" y="230" width="240" height="80" rx="20" fill="url(#metal)" />

    <!-- Side Clamps -->
    <rect x="15" y="80" width="16" height="220" rx="8" fill="#ffffff" />
    <rect x="269" y="80" width="16" height="220" rx="8" fill="#ffffff" />
  </g>
</svg>
